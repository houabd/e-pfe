services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: epfc_postgres
    environment:
      POSTGRES_USER: epfc_user
      POSTGRES_PASSWORD: epfc_pass
      POSTGRES_DB: epfc_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U epfc_user -d epfc_db']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: epfc_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: epfc_server
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://epfc_user:epfc_pass@postgres:5432/epfc_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      RAG_SERVICE_URL: http://chatbot:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chatbot:
        condition: service_started
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  chatbot:
    build: ./chatbot
    container_name: epfc_chatbot
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - chroma_data:/app/chroma_db
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: epfc_ollama
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  ollama_data:
  chroma_data:
